    <script id="recipe-data" type="application/json">[{"id":"desayunos/tortitas-de-avena","path":"desayunos/tortitas-de-avena.md","title":"Tortitas de avena","category":"desayunos","subcategory":"","servings":"1","tags":["avena","tortitas","vegetariana"],"ingredients":["30 g de copos de avena","1 huevo","50 ml de leche","0,5 g de canela molida","5 gotas de esencia de vainilla","2,5 g de polvo de hornear","sal"],"utensils":["Batidora de vaso","Sartén antiadherente","Espátula"],"steps":["Tritura los copos de avena en una batidora hasta pulverizarlos. Añade huevo, leche, canela, vainilla, polvo de hornear y sal, y bate hasta obtener una masa líquida homogénea.","Calienta una sartén antiadherente a fuego medio-bajo. Distribuye unas gotas de aceite con una servilleta para engrasar el fondo.","Vierte un tercio de la mezcla en el centro de la sartén. Mueve la sartén para extenderla o deja que conserve la forma que tome al verterla; el grosor dependerá de la cantidad de masa.","Cocina hasta que la tortita esté firme y aparezcan burbujas en la superficie. Dale la vuelta con una espátula y cocina aproximadamente 1 minuto más, hasta dorarla."],"notes":["La fuente no especifica el tiempo de cocción de la primera cara."]},{"id":"dulces/bizcocho-de-chocolate-al-horno","path":"dulces/bizcocho-de-chocolate-al-horno.md","title":"Bizcocho de chocolate al horno","category":"dulces","subcategory":"","servings":"8","tags":["bizcocho","chocolate","horno"],"ingredients":["175 g de mantequilla sin sal, blanda","175 g de azúcar extrafino","150 g de huevo, a temperatura ambiente","150 g de harina de trigo con levadura incorporada","50 g de cacao puro en polvo","4 g de levadura química","5 g de extracto de vainilla","sal fina, cantidad no especificada por la fuente","grasa desmoldeante, cantidad necesaria"],"utensils":["Molde redondo de 18 cm","Papel de horno","Bol","Batidora de varillas o cuchara de madera","Rejilla"],"steps":["Precalienta el horno a 180 °C con calor arriba y abajo, sin ventilador; engrasa el molde y cubre la base con papel de horno.","Coloca todos los ingredientes en el bol y bate durante 1 minuto, solo hasta obtener una masa lisa y homogénea.","Vierte la masa en el molde y alisa la superficie.","Hornea en la altura central durante 45–50 minutos, hasta que el bizcocho esté bien crecido, la superficie recupere la forma al presionarla y un palillo insertado en el centro salga limpio.","Deja reposar dentro del molde durante 5 minutos.","Pasa un cuchillo por el borde, desmolda sobre una rejilla y deja enfriar por completo."],"notes":["Fórmula comprobada de House \u0026 Garden para un único molde redondo de 18 cm: https://www.houseandgarden.co.uk/recipe/chocolate-cake-recipe","Las cantidades pequeñas originalmente expresadas por volumen se han convertido a masa con la tabla oficial de King Arthur Baking: https://www.kingarthurbaking.com/learn/ingredient-weight-chart","Los 150 g de huevo equivalen aproximadamente a 3 huevos grandes sin cáscara.","La fuente indica únicamente un pellizco de sal; se conserva la cantidad como no especificada para evitar inventar una masa.","La temperatura indicada corresponde a un horno convencional, sin ventilador."]},{"id":"dulces/bizcocho-de-limon-al-horno","path":"dulces/bizcocho-de-limon-al-horno.md","title":"Bizcocho de limón al horno","category":"dulces","subcategory":"","servings":"no especificadas","tags":["bizcocho","limón","horno"],"ingredients":["### Bizcocho","100 g de margarina de repostería blanda","175 g de azúcar extrafino","175 g de harina de trigo con levadura incorporada","4 g de levadura química","100 g de huevo, a temperatura ambiente","57 g de leche entera","ralladura fina de 1 limón","grasa desmoldeante, cantidad necesaria ### Glaseado","zumo de 1 limón","100 g de azúcar"],"utensils":["Molde redondo de 18 cm","Batidora de varillas","Bol","Rejilla"],"steps":["Precalienta el horno a 180 °C con calor arriba y abajo, sin ventilador; engrasa el molde y cubre la base con papel de horno.","Bate durante unos 2 minutos la margarina, el azúcar, la harina, la levadura química, el huevo, la leche y la ralladura hasta obtener una masa lisa y homogénea.","Vierte la masa en el molde y alisa la superficie.","Hornea durante 35–40 minutos, hasta que el bizcocho se separe ligeramente de las paredes y el centro recupere la forma al presionarlo suavemente.","Mezcla el zumo de limón con el azúcar del glaseado mientras se hornea el bizcocho.","Extiende el glaseado sobre el bizcocho inmediatamente después de sacarlo del horno.","Deja enfriar por completo dentro del molde, desmolda y retira el papel."],"notes":["Fórmula de Mary Berry para un único molde redondo de 18 cm, publicada por Lindy's Cakes y utilizada en sus talleres: https://lindyscakes.co.uk/2009/12/18/sallys-workshop-lemon-cake/","Las cantidades pequeñas originalmente expresadas por volumen se han convertido a masa con la tabla oficial de King Arthur Baking: https://www.kingarthurbaking.com/learn/ingredient-weight-chart","Los 100 g de huevo equivalen aproximadamente a 2 huevos grandes sin cáscara.","La fuente indica el zumo de un limón sin especificar su masa; se conserva esa incertidumbre para no alterar la fórmula comprobada.","La temperatura indicada corresponde a un horno convencional, sin ventilador."]},{"id":"dulces/granola","path":"dulces/granola.md","title":"Granola","category":"dulces","subcategory":"","servings":"no especificadas","tags":["desayuno","avena","chocolate"],"ingredients":["500 g de copos de avena","250 g de frutos secos y semillas","30 g de aceite de oliva","125 ml de agua","100 g de chocolate negro, del 60–70 % de cacao"],"utensils":["Bol","Horno"],"steps":["Trocea irregularmente los frutos secos y corta el chocolate en lascas.","Precalienta el horno a 150 °C.","Mezcla avena, frutos secos y semillas; emulsiona el agua con el aceite y añádelo a la mezcla.","Remueve hasta repartir la humedad de forma homogénea.","Hornea 15 minutos a 150 °C y remueve la mezcla.","Hornea tres tandas adicionales de 10 minutos, removiendo entre tandas.","Cuando la granola se haya enfriado hasta 50 °C, reparte el chocolate por encima y enfría en el frigorífico."],"notes":["Receta propia.","Los 30 g de aceite corresponden a las 2 cucharadas indicadas en el PPTX."]},{"id":"dulces/porridge","path":"dulces/porridge.md","title":"Porridge","category":"dulces","subcategory":"","servings":"no especificadas","tags":["desayuno","avena","frutas"],"ingredients":["30 g de salvado de avena","125 ml de leche","40 ml de agua","3 uvas pasas o dátiles","frutos rojos","1 cucharada de canela"],"utensils":["Cazo"],"steps":["Pica las uvas pasas o los dátiles y saca los frutos rojos del congelador con antelación si los usas congelados.","Lleva a ebullición leche, agua, uvas pasas y canela.","Incorpora la avena y vuelve a llevar a ebullición.","Cocina a fuego bajo unos 3 minutos, removiendo para que no se pegue.","Sirve y añade los frutos rojos."],"notes":["Receta de Marta.","El PPTX no especifica la cantidad de frutos rojos."]},{"id":"entrantes/crema-de-lombarda-y-manzana","path":"entrantes/crema-de-lombarda-y-manzana.md","title":"Crema de lombarda y manzana","category":"entrantes","subcategory":"","servings":"no especificadas","tags":["crema","lombarda","manzana"],"ingredients":["750 g de col lombarda","1 manzana grande o 2 pequeñas","600 ml de caldo de pollo o verduras","1 cebolla","1 diente de ajo","50 g de aceite de oliva","nuez moscada y pimienta negra"],"utensils":["Thermomix o batidora de vaso"],"steps":["Pica la lombarda unos segundos a velocidad 5 y corta la manzana con piel en trozos medianos.","Pica ajo y cebolla unos segundos a velocidad 5.","Añade aceite y sofríe 7 minutos en Varoma.","Incorpora la lombarda y sofríe 5 minutos en Varoma.","Añade caldo y especias; cocina 30 minutos a 100 °C.","Tritura a máxima potencia durante 5 minutos."],"notes":["Receta propia.","El PPTX no especifica la cantidad de especias."]},{"id":"entrantes/dim-sum-de-lentejas","path":"entrantes/dim-sum-de-lentejas.md","title":"Dim sum de lentejas","category":"entrantes","subcategory":"","servings":"no especificadas","tags":["lentejas","dim-sum","vegetariana"],"ingredients":["400 g de lentejas cocidas","100 g de setas shiitake","2 cebollas","4 dientes de ajo","1 zanahoria","un cuarto de col verde","láminas de pasta wonton","jengibre","salsa de soja","aceite de sésamo","sésamo"],"utensils":["Vaporera"],"steps":["Pela y pica cebollas, ajos y zanahoria; pica la col y las setas en trozos del mismo tamaño y ralla el jengibre.","Saltea el ajo y la cebolla con aceite de sésamo.","Añade zanahoria y col; rehoga removiendo.","Añade las setas y las lentejas; rehoga removiendo.","Incorpora jengibre y salsa de soja; reserva el relleno.","Corta las láminas de wonton en círculos, humedece los márgenes, rellena, dobla y sella.","Cuece al vapor unos 5 minutos y termina con sésamo."],"notes":["Receta de “La cocina de las legumbres”.","El relleno se puede congelar.","El PPTX no especifica cantidades para los condimentos ni las láminas de wonton."]},{"id":"guarniciones/coliflor-al-horno","path":"guarniciones/coliflor-al-horno.md","title":"Coliflor al horno","category":"guarniciones","subcategory":"","servings":"no especificadas","tags":["coliflor","horno","vegetariana"],"ingredients":["1 coliflor","1 cucharada de ras al-hanout","2 cucharadas de tahini","medio limón","granada","perejil","aceite de oliva"],"utensils":["Horno","Fuente de horno"],"steps":["Mezcla aceite con las especias y corta la coliflor en flores partidas por la mitad.","Precalienta el horno a 180 °C.","Mezcla las flores con el aceite especiado y hornea 30 minutos a 180 °C.","Mezcla tahini, zumo de limón y aceite y reparte la salsa sobre la coliflor.","Termina con granos de granada y perejil picado."],"notes":["Receta de “Eat!”.","El PPTX no especifica las cantidades de aceite, granada ni perejil."]},{"id":"guarniciones/pisto","path":"guarniciones/pisto.md","title":"Pisto","category":"guarniciones","subcategory":"","servings":"no especificadas","tags":["verduras","tomate","olla"],"ingredients":["5 tomates maduros","2 pimientos verdes italianos","1 pimiento de color","1 cebolla","1 calabacín","1 diente de ajo","aceite de oliva y sal"],"utensils":["Olla GMC"],"steps":["Corta todas las verduras en trozos medianos y lamina el ajo.","Saltea cada ingrediente por separado, salvo el ajo.","Incorpora todas las verduras a la olla, tapa sin presión y cocina 2,5 horas a 150 °C.","Destapa y continúa a 150 °C hasta que no quede líquido; corrige de sal."],"notes":["Receta propia con consejos de Loli.","El PPTX no especifica la cantidad de aceite."]},{"id":"masas/base-de-pizza","path":"masas/base-de-pizza.md","title":"Base de pizza","category":"masas","subcategory":"","servings":"no especificadas","tags":["pizza","masa","levadura"],"ingredients":["400 g de harina de trigo","200 ml de agua","30 g de aceite de oliva","15 g de levadura fresca o 5 g de levadura seca","8 g de sal"],"utensils":["Bol"],"steps":["Disuelve la levadura y el aceite en el agua.","Incorpora harina y sal; amasa durante 5 minutos.","Deja reposar la masa tapada con film durante 1 hora.","Estira la masa para usarla inmediatamente o congélala."],"notes":["Receta propia.","Los 30 g de aceite corresponden a las 2 cucharadas indicadas en el PPTX."]},{"id":"panificadora/pan-brioche-aceite","path":"panificadora/pan-brioche-aceite.md","title":"Pan brioche con aceite","category":"panificadora","subcategory":"","servings":"desconocido","tags":["brioche","sandwich","panificadora","dulce","aceite-de-oliva"],"ingredients":["135 g de leche entera, a temperatura ambiente (130 g si se usa miel)","100 g de huevo entero batido, aproximadamente 2 huevos L sin cáscara","25 g de azúcar (30 g de miel suave)","6 g de sal","60 g de AOVE suave","400 g de harina de fuerza Lidl o Belbake","5 g de levadura seca de panadero"],"utensils":["Panificadora UNOLD Backmeister Top Edition 68415","Cubeta y pala de la panificadora","Espátula","Rejilla"],"steps":["Coloca la pala en la cubeta y añade, en este orden, la leche, el huevo, el azúcar, la sal, el AOVE, la harina y la levadura.","Haz un pequeño hueco superficial en la harina para la levadura, evitando que al inicio toque directamente la sal o los líquidos.","Selecciona el programa 5, `Hefekuchen` o pan dulce, tamaño I y tostado claro; inicia el ciclo de 2 horas y 45 minutos.","Observa la masa tras los primeros 5 minutos de amasado: debe quedar muy blanda, elástica, algo pegajosa y cohesionada, sin formar una bola seca.","Si queda harina seca o la pala tiene dificultad, añade leche en incrementos de 5 g. Si la masa se extiende como una pasta y no empieza a cohesionarse, añade harina de fuerza en incrementos de 8 g y espera 2-3 minutos antes de corregir de nuevo.","Ayuda una sola vez con la espátula si queda harina en las esquinas; después, no abras la tapa durante el levado ni el horneado.","Al terminar el programa, cancela el mantenimiento en caliente, retira la cubeta, desmolda el brioche y déjalo enfriar sobre una rejilla durante al menos 2 horas.","Para obtener rebanadas más resistentes para sándwich, guarda el brioche ya frío en un recipiente cerrado y córtalo varias horas después o al día siguiente."],"notes":["Se usan 60 g de AOVE suave en lugar de 75 g de mantequilla. El aceite es prácticamente grasa pura, mientras que la mantequilla contiene agua; esta cantidad evita que el pan quede excesivamente graso.","No intentes obtener una bola seca: la masa de brioche debe quedar blanda y algo pegajosa.","Para retirar el amasador, pausa el programa al cabo de 1 hora y 7 minutos desde el inicio; el visor muestra 1 hora y 38 minutos restantes. Hazlo antes del tercer levado y reanuda en menos de 5 minutos."]},{"id":"panificadora/pan-brioche","path":"panificadora/pan-brioche.md","title":"Pan brioche","category":"panificadora","subcategory":"","servings":"desconocido","tags":["brioche","sandwich","panificadora","dulce"],"ingredients":["141 g de leche entera, a temperatura ambiente","100 g de huevo entero batido, aproximadamente 2 huevos","50 g de azúcar","6 g de sal","75 g de mantequilla blanda, cortada en trocitos","400 g de harina de fuerza Lidl o Belbake","5 g de levadura seca de panadero"],"utensils":["Panificadora UNOLD Backmeister Top Edition 68415","Cubeta y pala de la panificadora","Espátula","Rejilla"],"steps":["Coloca la pala en la cubeta y añade, en este orden, la leche, el huevo, el azúcar, la sal, la mantequilla, la harina y la levadura.","Haz un pequeño hueco superficial en la harina para la levadura, evitando que al inicio toque directamente la sal o los líquidos.","Selecciona el programa 5, `Hefekuchen` o pan dulce, tamaño I y tostado claro; inicia el ciclo de 2 horas y 45 minutos.","Observa la masa tras los primeros 5 minutos de amasado: debe quedar muy blanda, elástica, algo pegajosa y cohesionada, sin formar una bola seca.","Si queda harina seca o la pala tiene dificultad, añade leche en incrementos de 5 g. Si la masa se extiende como una pasta y no empieza a cohesionarse, añade harina de fuerza en incrementos de 8 g y espera 2-3 minutos antes de corregir de nuevo.","Ayuda una sola vez con la espátula si queda harina en las esquinas; después, no abras la tapa durante el levado ni el horneado.","Al terminar el programa, cancela el mantenimiento en caliente, retira la cubeta, desmolda el brioche y déjalo enfriar sobre una rejilla durante al menos 2 horas.","Para obtener rebanadas más resistentes para sándwich, guarda el brioche ya frío en un recipiente cerrado y córtalo varias horas después o al día siguiente."],"notes":["La versión rica anterior, con 100 g de mantequilla y 100 g de huevo entero para 400 g de harina, dio buen sabor pero una miga demasiado ligera y frágil para bocadillos. La variante anterior para sándwich reducía la mantequilla a 60 g y el huevo a 50 g. Esta receta usa 75 g de mantequilla y 100 g de huevo entero, sin separar claras y yemas; la leche se reduce para compensar el aumento de huevo.","No intentes obtener una bola seca: la masa de brioche debe quedar blanda y algo pegajosa.","Para retirar el amasador, pausa el programa al cabo de 1 hora y 7 minutos desde el inicio; el visor muestra 1 hora y 38 minutos restantes. Hazlo antes del tercer levado y reanuda en menos de 5 minutos.","Fuentes consultadas: [manual de la UNOLD 68415](../manuales/68415-BACKMEISTER-Top-Edition-Manual.pdf), [receta y opiniones de brioche en panificadora](https://cuisine.journaldesfemmes.fr/recette/329028-brioche-en-machine-a-pain), [foro de recetas para panificadora](https://www.aufeminin.com/forum/cuisine/recette-de-brioche-pour-machine-a-pain-fd3919153) y [foro sobre brioche que no sube](https://sante-medecine.journaldesfemmes.fr/forum/cuisine/affich-60008491-bonjour-je-n-arrive-pas-a-faire-de-brioche-dans-ma-machine-a-pain-elle-ne-mont)."]},{"id":"panificadora/pan-de-calabaza","path":"panificadora/pan-de-calabaza.md","title":"Pan de calabaza","category":"panificadora","subcategory":"","servings":"desconocido","tags":["calabaza","panificadora","fermentacion-nocturna"],"ingredients":["450 g de harina panadera","150 g de calabaza asada, hecha puré muy espeso y con casi nada de agua","210 g de leche","25 g de mantequilla muy blanda, en trozos pequeños o derretida","5 g de sal","3 g de levadura seca de panadero"],"utensils":["Panificadora UNOLD Backmeister Top Edition 68415","Cubeta y pala de la panificadora","Rejilla"],"steps":["Coloca la pala en la cubeta y añade la leche, el puré de calabaza, la mantequilla, la sal, la harina y la levadura en un hueco superficial de la harina.","Selecciona el programa 8, `Teig` o masa, e inícialo. Deténlo cuando todos los ingredientes formen una bola homogénea con textura de plastilina; no es necesario completar el programa.","Guarda la masa en la cubeta toda la noche en el frigorífico.","Por la mañana, si es invierno, deja la cubeta 1 hora a temperatura ambiente antes de hornear; en verano, inicia el horneado directamente desde el frigorífico.","Selecciona el programa 2, `Vollkorn` o pan integral, en tamaño I. Elige el tostado según preferencia e inicia el programa.","Al terminar, cancela el mantenimiento en caliente, desmolda el pan y déjalo enfriar completamente sobre una rejilla antes de cortarlo."],"notes":["El programa 8 dura 1 hora y 30 minutos si se completa; la fuente indica interrumpirlo cuando la masa sea una bola homogénea, sin un tiempo concreto.","Equivalencia entre modelos: en la UNOLD 68456 Edel, el programa 8 también es masa; su programa 3, pan integral, equivale al programa 2, `Vollkorn`, de la UNOLD 68415. El programa 3 de la 68415 es `Weissbrot` o pan blanco y no es equivalente.","Para retirar el amasador en el programa 2, tamaño I, pausa al cabo de 1 hora y 27 minutos desde el inicio; el visor muestra 2 horas y 5 minutos restantes. Hazlo antes del tercer levado y reanuda en menos de 5 minutos.","No verificado — guessing: 1 cucharadita de sal equivale a 5 g y 1 cucharadita de levadura equivale a 3 g de levadura seca de panadero. La fuente no especifica tipo de levadura ni equivalencias en masa.","No verificado — guessing: el tamaño I es adecuado porque la masa suma aproximadamente 843 g antes de hornear; el manual reserva este tamaño para panes de aproximadamente 750-1.000 g.","La duración exacta de «toda la noche» y el grado de tostado no fueron especificados por la fuente.","Fuente de la fórmula y método: Isa New Work. Adaptación de programas: [manual de la UNOLD 68415](../manuales/68415-BACKMEISTER-Top-Edition-Manual.pdf)."]},{"id":"panificadora/pan-de-centeno-50-50","path":"panificadora/pan-de-centeno-50-50.md","title":"Pan de centeno 50/50","category":"panificadora","subcategory":"","servings":"desconocido","tags":["centeno","panificadora","trigo","sin-masa-madre"],"ingredients":["350 g de agua","15 g de aceite de oliva","15 g de miel o melaza","250 g de harina de centeno","250 g de harina de trigo panificable","8 g de sal","7 g de levadura seca de panadero"],"utensils":["Panificadora UNOLD Backmeister Top Edition 68415","Cubeta y pala de la panificadora","Espátula","Rejilla"],"steps":["Coloca la pala en la cubeta y añade el agua, el aceite de oliva, la miel o melaza, las harinas y la sal.","Haz un pequeño hueco superficial en la harina y añade la levadura, evitando que al inicio toque directamente el agua o la sal.","Selecciona el programa `BASIS` o básico, tamaño I y tostado medio; inicia el programa.","Observa la masa tras los primeros 5 minutos de amasado: debe quedar blanda, pegajosa y cohesionada, sin harina seca en las esquinas.","Si queda harina seca, incorpora agua poco a poco. Si la masa está muy fluida y no se cohesiona, incorpora harina de trigo poco a poco y espera unos minutos antes de corregir de nuevo.","Ayuda una sola vez con la espátula si queda harina en las esquinas y después no abras la tapa durante el levado ni el horneado.","Al terminar el programa, cancela el mantenimiento en caliente, retira la cubeta, desmolda el pan y déjalo enfriar completamente sobre una rejilla antes de cortarlo."],"notes":["Produce un pan de aproximadamente 750 g. El programa básico y el tamaño I corresponden al manual de la UNOLD Backmeister Top Edition 68415.","El pan queda más oscuro, húmedo y compacto que uno de trigo; la proporción de 50 % de trigo mantiene una miga rebanable.","La miel o melaza y el aceite son opcionales, pero se incluyen en la fórmula para aportar sabor, color y una miga más tierna.","No verificado — guessing: esta adaptación sin masa madre de la receta de centeno del manual de UNOLD funciona con 7 g de levadura seca; el fabricante no publica esta combinación concreta ni el peso final exacto.","Fuente de programa y capacidad: [manual de la UNOLD 68415](../manuales/68415-BACKMEISTER-Top-Edition-Manual.pdf)."]},{"id":"panificadora/pan-de-espelta-integral","path":"panificadora/pan-de-espelta-integral.md","title":"Pan de espelta integral","category":"panificadora","subcategory":"","servings":"desconocido","tags":["espelta","integral","panificadora"],"ingredients":["280 g de agua","15 g de aceite de oliva","10 g de miel","8 g de sal","400 g de harina integral de espelta","3 g de levadura seca de panadero"],"utensils":["Panificadora UNOLD Backmeister Top Edition 68415","Cubeta y pala de la panificadora","Espátula","Rejilla"],"steps":["Coloca la pala en la cubeta y añade el agua, el aceite, la miel, la sal y la harina de espelta integral.","Haz un hueco superficial en la harina y añade la levadura, evitando que al inicio toque directamente el agua o la sal.","Selecciona el programa 1, `Basis`, tamaño I y tostado medio; inicia el programa.","Observa la masa tras los primeros 5 minutos de amasado. Debe estar blanda y pegajosa, y la pala debe ir incorporando la masa; no hace falta que esta alcance por sí sola las esquinas.","Si queda harina suelta en las esquinas, ayúdala una sola vez con la espátula para incorporarla. No añadas agua solo por esa harina: añade hasta 20 g únicamente si la masa sigue seca o desmigada tras mezclarla. Si está muy fluida y no mantiene una bola, añade harina integral de espelta poco a poco.","Después de esa ayuda, no abras la tapa durante el levado ni el horneado.","Al terminar el programa, cancela el mantenimiento en caliente, retira la cubeta y deja enfriar el pan dentro durante unos 10 minutos. Después, desmóldalo y déjalo enfriar completamente sobre una rejilla antes de cortarlo."],"notes":["La masa pesa aproximadamente 716 g antes de hornear. La UNOLD indica un rango de peso de pan de 750-1.200 g para el modelo 68415.","En una prueba con 280 g de agua, 3 g de levadura seca Saf-Instant y el programa 1 `Basis`, el resultado fue bueno. No consta si se retiró la pala ni cuánto se esperó antes de desmoldar.","El programa 1 `Basis` dura 2 horas y 55 minutos en tamaño I. No uses `Vollkorn Schnell`: el manual advierte que su levado corto produce un pan más compacto.","En `Basis`, cuando quedaban 1 hora y 50 minutos, el visor ya indicaba `Rise 3` (tercer levado).","La harina integral de espelta puede formar una masa más blanda y menos estable que el trigo panificable; la absorción y el comportamiento varían entre harinas. No añadas agua solo porque la masa no llegue a las esquinas de la cubeta.","En una hornada anterior con 4 g de levadura el pan se hundió al empezar el horneado, también con el programa `Basis`. Con 3 g y 280 g de agua el resultado fue bueno; este cambio conjunto no permite aislar cuál de las dos cantidades explica la mejora.","Fuentes: [página oficial de la UNOLD Backmeister Top Edition 68415, con acceso al manual](https://unold.de/products/backmeister-top-edition), [estudio sobre calidad de panificación de espelta](https://pmc.ncbi.nlm.nih.gov/articles/PMC7828489/), [guía sobre sobrefermentación](https://www.kingarthurbaking.com/yeast-bread-primer)."]},{"id":"panificadora/pan-integral-50-50","path":"panificadora/pan-integral-50-50.md","title":"Pan integral 50/50","category":"panificadora","subcategory":"","servings":"desconocido","tags":["integral","panificadora","trigo"],"ingredients":["370 g de agua","25 g de mantequilla o margarina","5 g de sal","4 g de azúcar","270 g de harina de trigo tipo 1050","270 g de harina integral de trigo","5,25 g de levadura seca de panadero"],"utensils":["Panificadora UNOLD Backmeister Top Edition 68415","Cubeta y pala de la panificadora","Espátula","Rejilla"],"steps":["Coloca la pala en la cubeta y añade, en este orden, el agua, la mantequilla o margarina, la sal, el azúcar, la harina tipo 1050, la harina integral y la levadura.","Haz un pequeño hueco superficial en la harina para la levadura, evitando que al inicio toque directamente el agua o la sal.","Selecciona el programa 2, `Vollkorn` o pan integral, y el tamaño II; el manual no prescribe un grado de tostado concreto.","Inicia el programa y observa la masa tras los primeros 5 minutos de amasado: debe quedar blanda y ligeramente pegajosa, sin formar hilos.","Si la masa está demasiado húmeda, incorpora harina poco a poco hasta alcanzar la consistencia indicada. Si está demasiado seca, incorpora agua poco a poco. El manual no cuantifica estos posibles ajustes porque dependen de la harina y de la humedad ambiental.","Cierra la tapa después de comprobar la masa y no vuelvas a abrirla durante el levado ni el horneado.","Al terminar, cancela el mantenimiento en caliente, retira la cubeta, desmolda el pan y déjalo enfriar completamente sobre una rejilla antes de cortarlo."],"notes":["Receta publicada por UNOLD para el modelo 68415. Corresponde al tamaño II y produce un pan de aproximadamente 860 g.","La receta del fabricante indica una medida pequeña rasa de sal y otra de azúcar. Se expresan como 5 g de sal y 4 g de azúcar mediante equivalencias de masa verificadas, sin cambiar la fórmula.","El manual define cada sobre de levadura seca como 7 g; tres cuartos de sobre equivalen a 5,25 g.","La harina tipo 1050 forma parte de la receta comprobada. No se propone harina de fuerza como sustitución porque el fabricante no verifica ese cambio.","El manual permite elegir el tostado, pero no recomienda uno para esta receta; selecciónalo según preferencia.","No se incluye fermentación nocturna: es una técnica válida, pero no forma parte de la receta comprobada por UNOLD y exigiría ajustar levadura, tiempos y programa.","Para retirar el amasador, pausa el programa al cabo de 1 hora y 30 minutos desde el inicio; el visor muestra 2 horas y 10 minutos restantes. Hazlo antes del tercer levado y reanuda en menos de 5 minutos.","Fuentes: [manual de la UNOLD 68415](../manuales/68415-BACKMEISTER-Top-Edition-Manual.pdf) y [equivalencias en masa de sal y azúcar](https://www.edeka.de/wissen/tipps-und-tricks/wie-kann-man-die-grammzahl-ohne-waage-messen/)."]},{"id":"principales/carne/curry-verde-de-pollo-y-brocoli","path":"principales/carne/curry-verde-de-pollo-y-brocoli.md","title":"Curry verde de pollo y brócoli","category":"principales","subcategory":"carne","servings":"no especificadas","tags":["pollo","curry","brócoli"],"ingredients":["500 g de muslos o cuartos traseros de pollo o pavo","1 brócoli","1 cebolla","5 dientes de ajo","1 berenjena","1 lima","1 cucharada de pasta de curry verde","1 lata de leche de coco","comino","1 palo de canela","jengibre","3 hojas de lima","3 trozos de hierba limón","6 rodajas de jalapeño","albahaca, cilantro y cebollino frescos","cebolla frita","100 g de arroz basmati"],"utensils":["Cazuela con tapa"],"steps":["Corta la cebolla en juliana, pica el ajo, corta la berenjena en dados y sálala para que suelte agua.","Extrae los gajos de lima sin piel, separa las flores y el tallo del brócoli y lava el arroz hasta que el agua salga clara.","Sella la carne y resérvala.","Sofríe cebolla y ajo; añade pasta de curry y comino y tuéstalos sin quemarlos.","Incorpora jengibre y berenjena, después leche de coco, albahaca, canela, jalapeños, hojas de lima y hierba limón.","Añade la carne, tapa y cocina 20 minutos.","Dora un diente de ajo, saltea el arroz, añade agua y cocínalo el tiempo indicado por el fabricante.","Sirve el curry con cilantro, arroz, cebollino y cebolla frita."],"notes":["Receta propia.","El PPTX no indica cantidades de comino, jengibre, hierbas frescas, cebolla frita ni agua para el arroz."]},{"id":"principales/carne/lomo-a-la-sal","path":"principales/carne/lomo-a-la-sal.md","title":"Lomo a la sal","category":"principales","subcategory":"carne","servings":"no especificadas","tags":["cerdo","horno","fiambre"],"ingredients":["1 kg de lomo de cerdo ibérico","10 ml de aceite","1 cucharada de pimentón","1 cucharada de tomillo","1 cucharada de romero","1 cucharada de orégano","3 kg de sal de horno"],"utensils":["Olla con tapa","Papel de horno"],"steps":["Adoba el lomo con aceite, pimentón, tomillo, romero y orégano durante al menos 12 horas.","Cubre el fondo de la olla con papel de horno y una capa de sal de 1 cm.","Parte el lomo en dos trozos, colócalos con la grasa hacia arriba y cúbrelos completamente con sal.","Humedece ligeramente la sal, tapa la olla y cocina 60 minutos a 140 °C.","Deja enfriar en la olla 15 minutos, retira la sal y enfría el lomo envuelto en papel.","Corta el lomo frío en lonchas lo más finas posible."],"notes":["Fuente: juanideanasevilla.com.","Las cantidades de especias se conservan como aparecen en el PPTX."]},{"id":"principales/carne/noquis-con-bolonesa-miel-y-citricos","path":"principales/carne/noquis-con-bolonesa-miel-y-citricos.md","title":"Ñoquis con boloñesa, miel y cítricos","category":"principales","subcategory":"carne","servings":"no especificadas","tags":["ñoquis","boloñesa","cítricos"],"ingredients":["500 g de patatas cocidas","100 g de harina","2 huevos, usando 2 yemas y 1 clara","tomillo","2 cucharadas de miel","2 cucharadas colmadas de mostaza antigua","1 lima","6 naranjas sanguinas","vinagre de Jerez","salsa boloñesa","parmesano"],"utensils":["Pasapurés","Cazo"],"steps":["Cuece las patatas en agua con un 7 % de sal y pásalas por el pasapurés mientras aún estén calientes.","Exprime las naranjas y la lima.","Hierve la miel a fuego medio, añade los zumos, la mostaza y unas gotas de vinagre; reduce hasta obtener una crema.","Mezcla el puré con el huevo y la harina sin amasar en exceso.","Forma 4–6 cilindros de 2 cm de diámetro y córtalos en porciones de unos 2 cm.","Cuece los ñoquis en agua hirviendo y retíralos cuando floten.","Sirve con salsa boloñesa, parmesano y salsa de miel y cítricos alrededor."],"notes":["Receta de Dabiz Muñoz.","La cantidad de salsa boloñesa, parmesano, tomillo y vinagre no está especificada."]},{"id":"principales/carne/paella-de-pollo-garbanzos","path":"principales/carne/paella-de-pollo-garbanzos.md","title":"Paella de pollo con garbanzos y judías verdes","category":"principales","subcategory":"carne","servings":"2.5","tags":["española","arroz","pollo","sin-gluten"],"ingredients":["250 g de arroz redondo","350-400 g de pollo, troceado","100-120 g de garbanzos cocidos","150 g de judías verdes","750 g aproximadamente de caldo de pollo, caliente","100 g de tomate triturado o rallado","1 diente de ajo, picado","aproximadamente 2 g de pimentón dulce","unas hebras de azafrán o colorante","aceite de oliva, cantidad desconocida","sal, cantidad desconocida","romero, opcional"],"utensils":["Sartén grande de 32-36 cm"],"steps":["Calienta aceite de oliva en la sartén y dora bien el pollo con sal.","Añade las judías verdes y sofríelas durante 4-5 minutos.","Incorpora el ajo y el tomate; añade el pimentón dulce al final y sofríelo durante unos segundos.","Vierte el caldo de pollo caliente, añade los garbanzos y el azafrán o colorante, y deja hervir 5-10 minutos para que el caldo tome sabor.","Añade el arroz, repártelo de forma uniforme y no vuelvas a removerlo.","Cocina 8 minutos a fuego fuerte y 9-10 minutos a fuego medio-bajo.","Si al final queda líquido, sube el fuego; si se seca demasiado pronto, añade un poco de caldo caliente. Añade romero si se desea."],"notes":["Para una capa fina de arroz en una sartén grande, 250 g de arroz y 750 g de caldo son un buen punto de partida.","Ajusta el caldo durante la cocción según la evaporación; cantidad exacta desconocida."]},{"id":"principales/carne/tacos-de-pimiento-y-ternera","path":"principales/carne/tacos-de-pimiento-y-ternera.md","title":"Tacos de pimiento y ternera","category":"principales","subcategory":"carne","servings":"no especificadas","tags":["ternera","tacos","pimientos"],"ingredients":["500 g de falda de ternera","2 cebollas","30 g de concentrado de tomate","1 chile fresco","1 pimiento verde grande","1 pimiento rojo grande","1 pimiento amarillo grande","6 cogollos de Tudela o tortillas de maíz","vino de Jerez o manzanilla","aceite de oliva, sal y pimienta"],"utensils":["Olla GMC"],"steps":["Pica finamente el chile y una cebolla; corta la carne en trozos de 3–4 cm, la otra cebolla en juliana ancha y los pimientos en tiras.","Rehoga la cebolla picada con el chile en la olla hasta que se dore.","Incorpora la carne, dórela y añade vino; deja que evapore el alcohol.","Añade agua, concentrado de tomate y pimienta; cocina 20 minutos en modo presión.","Despresuriza y cocina en fuego lento 1,5 horas, o hasta que la carne esté tierna.","Desmenuza la carne, reduce el caldo sobrante y mézclalo con ella; deja reposar de un día para otro.","Saltea los pimientos por separado: los verdes con vino, los rojos con aceite de sésamo, vinagre de Jerez y sésamo, y los amarillos con salsa de soja.","Saltea cebolla con chile para el acompañamiento y prepara salsa de yogur con ajo, yogur griego, zumo de limón, yerbabuena, aceite y sal.","Sirve la ternera con los pimientos, la cebolla picante y la salsa de yogur en cogollos o tortillas."],"notes":["Receta de “Eat!”.","El PPTX no especifica la cantidad de vino, agua, aceite ni los ingredientes de la salsa de yogur."]},{"id":"principales/pescado/bacalao-con-judias-y-brocoli","path":"principales/pescado/bacalao-con-judias-y-brocoli.md","title":"Bacalao con judías y brócoli","category":"principales","subcategory":"pescado","servings":"no especificadas","tags":["bacalao","judías","brócoli"],"ingredients":["200 g de judías blancas cocidas","300 g de lomos de bacalao congelado","media cebolla","medio brócoli","1 limón","cebollino","tomillo"],"utensils":["Envasadora al vacío","Cazuela"],"steps":["Envasa el bacalao al vacío con rodajas de limón y tomillo durante 24 horas.","Corta el brócoli en flores, la cebolla en juliana y el cebollino muy fino; lava las judías.","Hierve el brócoli 5 minutos, enfríalo en agua fría, escúrrelo y sécalo.","Cocina el bacalao envasado 10 minutos en agua a 60 °C.","Saltea la cebolla, añade judías y brócoli, y saltea el conjunto.","Incorpora el caldo que haya soltado el bacalao, desmígalo y sírvelo sobre las judías."],"notes":["Receta de “La cocina de las legumbres”."]},{"id":"principales/pescado/bonito-con-arroz-y-pico-de-gallo","path":"principales/pescado/bonito-con-arroz-y-pico-de-gallo.md","title":"Bonito con arroz y pico de gallo","category":"principales","subcategory":"pescado","servings":"no especificadas","tags":["bonito","arroz","aguacate"],"ingredients":["200 g de atún o bonito","1 aguacate","1 lata pequeña de maíz dulce","mantequilla","1 cebolla roja","1 lima","cilantro","100 g de arroz basmati","perejil","albahaca","1 limón","1 diente de ajo","aceite, sal y pimienta"],"utensils":["Cazo","Plancha"],"steps":["Corta la cebolla y el aguacate en dados del tamaño de un grano de maíz.","Cuece el arroz según las instrucciones del fabricante y déjalo enfriar.","Prepara una pasta con zumo y ralladura de limón, ajo, aceite y hierbas; mézclala con el arroz y deja reposar de un día para otro.","Saltea el maíz con mantequilla y deja enfriar.","Mezcla el maíz con aguacate y cebolla; aliña con zumo de lima y cilantro picado.","Atempera el bonito, salpimiéntalo y márcalo a la plancha unos 3 minutos por cada lado."],"notes":["Receta de “Eat!”.","El PPTX no especifica las cantidades de mantequilla, hierbas, aceite, sal y pimienta."]},{"id":"principales/pescado/noodles-con-almejas-coco-y-cafe","path":"principales/pescado/noodles-con-almejas-coco-y-cafe.md","title":"Noodles con almejas, coco y café","category":"principales","subcategory":"pescado","servings":"no especificadas","tags":["noodles","marisco","coco"],"ingredients":["15 g de tomate frito","6 cebollitas francesas o chalotas","4 dientes de ajo","1 lima","150 g de noodles","150 ml de vino de manzanilla","400 ml de leche de coco","100 ml de caldo de pescado o media pastilla de caldo","4 piparras en vinagre","1 cucharada de pimentón","400 g de almejas o mejillones","1 pizca de café molido","estragón o cebollino"],"utensils":["Cazuela"],"steps":["Corta cuatro cebollitas finas y fríelas a fuego medio hasta que estén crujientes; escúrrelas en papel absorbente.","Lamina los ajos, corta la cebolla restante y extrae seis gajos de lima sin piel; exprime el resto de la lima.","Rehoga el ajo, añade la cebolla, el tomate y la manzanilla; deja evaporar el alcohol.","Incorpora leche de coco y caldo de pescado.","Cuece los noodles, dejándolos 2 minutos pendientes de cocción.","Añade piparras, almejas y noodles a la cazuela; tapa y apaga el fuego.","Prepara aceite de pimentón con el aceite de freír las cebollitas.","Tras 5 minutos, incorpora la lima y sirve con el aceite de pimentón, cebolla frita y café."],"notes":["Receta de Dabiz Muñoz.","El PPTX conserva cucharadas y una pizca como medidas originales."]},{"id":"principales/vegetarianos/lentejas-estofadas","path":"principales/vegetarianos/lentejas-estofadas.md","title":"Lentejas estofadas","category":"principales","subcategory":"vegetarianos","servings":"no especificadas","tags":["lentejas","cuchara","legumbres"],"ingredients":["300 g de lentejas","1 cebolla","medio pimiento verde","1 zanahoria","4 dientes de ajo","1 chorizo, sustituible por 50 g de aceite","1 l de caldo de pollo o verduras","1 hoja de laurel","1 cucharada de pimentón"],"utensils":["Olla GMC","Batidora"],"steps":["Lava las lentejas; no necesitan remojo.","Corta la zanahoria en rodajas, pica los ajos y corta el pimiento en trozos medianos.","Incorpora todos los ingredientes a la olla y cocina 10 minutos en modo Turbo, alta presión, a 130 °C.","Reserva 100 ml de caldo, retira la cebolla y tritúrala con el caldo reservado.","Devuelve la mezcla a la olla y cocina a fuego lento 30–60 minutos, hasta el punto de cocción deseado."],"notes":["Receta propia.","La cantidad de pimentón se conserva como aparece en el PPTX."]},{"id":"principales/vegetarianos/tortilla-de-patatas","path":"principales/vegetarianos/tortilla-de-patatas.md","title":"Tortilla de patatas","category":"principales","subcategory":"vegetarianos","servings":"no especificadas","tags":["patatas","huevos","española"],"ingredients":["750 g de patatas","220 g de cebolla","20 ml de aceite","8 huevos","5 g de sal","pimienta","agua"],"utensils":["Olla GMC","Bol"],"steps":["Corta la cebolla en juliana y chasca las patatas en trozos.","Mezcla en la cubeta aceite, patatas, cebolla, agua y la mitad de la sal.","Cocina con tapa y válvula cerrada en modo guiso, media presión, a 160 °C durante 8 minutos; añade 1 minuto si prefieres la cebolla más tostada.","Bate los huevos con el resto de sal y pimienta; incorpora las patatas y aplasta ligeramente algunas contra el bol.","Lava la cubeta, engrásala y caliéntala unos minutos en función plancha.","Vierte la preparación y cocina con válvula abierta en menú plancha a 140 °C durante 10 minutos.","Cancela el programa y deja reposar la tortilla cerrada 10 minutos para que termine de cuajar; abre antes si la prefieres menos cuajada."],"notes":["Fuente: juanideanasevilla.com.","El PPTX no especifica la cantidad de agua."]},{"id":"salsas/salmorreta","path":"salsas/salmorreta.md","title":"Salmorreta","category":"salsas","subcategory":"","servings":"no especificadas","tags":["alicantina","arroz","congelable"],"ingredients":["aproximadamente 26,7 g de carne de ñora rehidratada, sin piel ni semillas; se puede sustituir por pulpa de ñora en conserva, con un resultado distinto","aproximadamente 26,7 g de ajo pelado y laminado","400 g de tomate triturado","aproximadamente 101,5 g de aceite de oliva virgen extra, equivalentes a los 111,1 ml del escalado de la fuente","sal al gusto, cantidad no especificada"],"utensils":["Thermomix","Colador fino","Recipientes pequeños aptos para congelar"],"steps":["Pon el aceite y el ajo en el vaso y sofríe 2 min/120 °C (o temperatura Varoma si el modelo no ofrece 120 °C)/velocidad 1.","Añade la carne de ñora y rehoga 30 s/120 °C (o temperatura Varoma si el modelo no ofrece 120 °C)/velocidad 1.","Incorpora el tomate y la sal.","Cocina 30–40 min/Varoma/giro inverso/velocidad cuchara, con el cestillo sobre la tapa en lugar del cubilete para que evapore; comprueba que el tomate haya perdido el agua suelta y esté bien reducido.","Deja que la mezcla se enfríe antes de triturarla. Tritura progresivamente hasta obtener una crema fina, siguiendo las instrucciones de seguridad del modelo.","Pasa la salmorreta por un colador fino, presionando con la espátula.","Reparte la salmorreta en recipientes pequeños para enfriarla y congelarla antes de que transcurran 2 horas desde la cocción."],"notes":["Fuente: [salmorreta de Directo al Paladar](https://www.directoalpaladar.com/cultura-gastronomica/receta-definitiva-salmorreta-para-tus-arroces-fideuas-cinco-trucos-chef-alicantino-quede-perfecta). Se escala la tanda profesional citada por el usuario, sin mezclarla con las proporciones de la versión doméstica del artículo.","El lote se escala a partir de 400 g de tomate triturado. El factor es 400 / 900 = 4 / 9: aplicado a los 60 g de ñora, 60 g de ajo y 250 ml de aceite originales, resulta en aproximadamente 26,7 g de ñora, 26,7 g de ajo y 111,1 ml de aceite.","Los 101,5 g de aceite son una conversión aproximada de 111,1 ml a masa, usando la densidad orientativa de 0,910–0,916 a 20 °C recogida en la [referencia del Codex publicada por la FAO](https://www.fao.org/4/Y2774E/y2774e04.htm).","El chef describe una reducción de 3–3,5 horas para su tanda grande; el artículo propone 30–40 minutos en casa. El tiempo no se escala linealmente: manda la reducción del tomate.","No verificado — guessing: los ajustes de tiempo, temperatura y velocidad propuestos para Thermomix reproducen el resultado de la receta original. Son una adaptación no probada; el tiempo de reducción puede variar según el modelo y el tomate.","Al cocinar a temperatura Varoma, usa el accesorio original indicado por el manual del modelo para cubrir la abertura y permitir que salga el vapor. No tapes la abertura con un paño. La guía de seguridad de [Thermomix TM5](https://service.thermomix.com/hc/en-us/articles/360000661247-Important-Safeguards-for-your-Thermomix-TM5) requiere dejar libre la salida de vapor y triturar alimentos calientes aumentando la velocidad gradualmente.","No verificado — guessing: la adaptación con tomate triturado y pulpa de ñora en conserva dará el mismo resultado que la versión profesional. No se ha probado en cocina ni con tu conserva de ñora; el peso final depende de la evaporación y del colado.","Incorpora la salmorreta después de rehogar el arroz y antes de añadir el caldo, según la fuente.","Conserva hasta 3 meses congelada; descongela en nevera y utiliza dentro de las 24 horas siguientes, según las [recomendaciones de NSW Food Authority](https://www.foodauthority.nsw.gov.au/consumer/food-extra-care/leftovers)."]},{"id":"salsas/salsa-bolonesa","path":"salsas/salsa-bolonesa.md","title":"Salsa boloñesa","category":"salsas","subcategory":"","servings":"no especificadas","tags":["carne","tomate","pasta"],"ingredients":["500 g de carne de ternera picada","1 puerro","1 zanahoria pequeña","1 chorizo ahumado picante","5 dientes de ajo","700 g de salsa de tomate frito","150 ml de vino tinto","ras al-hanout","sal y chile picante"],"utensils":["Cazuela"],"steps":["Pica muy finos todos los ingredientes.","Cocina el ajo y el puerro con un poco de sal hasta que se doren.","Añade zanahoria y carne; cocina hasta que la carne esté hecha por fuera.","Añade vino y deja evaporar el alcohol.","Incorpora ras al-hanout y salsa de tomate; cocina a fuego bajo 45 minutos.","Diez minutos antes de terminar, ajusta especias, picante y sal."],"notes":["Receta de Dabiz Muñoz.","Los 150 ml de vino corresponden al vaso indicado en el PPTX; la cantidad de ras al-hanout figura como una cucharada sopera."]}]</script>
